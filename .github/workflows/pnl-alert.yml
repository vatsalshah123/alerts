name: Portfolio P&L Alert

on:
  schedule:
    # Runs hourly, ~9:12 AM to 3:12 PM IST (= 3:42 AM to 9:42 AM UTC), Mon-Fri.
    # Minute 42 (not :00/:15/:30/:45) to avoid GitHub's busiest scheduler slots,
    # which reduces (but can't fully eliminate) the chance of a delayed/dropped run.
    - cron: '42 3,4,5,6,7,8,9 * * 1-5'
  workflow_dispatch:  # lets you trigger it manually from the Actions tab too

permissions:
  actions: write
  contents: read

jobs:
  send-alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run P&L alert
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python portfolio_pnl_alert.py

      - name: Prune workflow runs older than 1 day
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cutoff=$(date -u -d '1 day ago' +%s)
          gh run list --workflow "pnl-alert.yml" --limit 500 --json databaseId,createdAt \
            --jq '.[] | [.databaseId, .createdAt] | @tsv' |
          while IFS=$'\t' read -r run_id created_at; do
            if [ "$run_id" = "$GITHUB_RUN_ID" ]; then
              continue
            fi
            run_ts=$(date -u -d "$created_at" +%s)
            if [ "$run_ts" -lt "$cutoff" ]; then
              echo "Deleting run $run_id (created $created_at)"
              gh run delete "$run_id" || true
            fi
          done